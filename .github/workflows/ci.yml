name: CI

on:
  push:
    branches:
      - release-3.1
  pull_request:
    branches:
      - release-3.1

permissions:
  contents: read

jobs:
  test:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java:
          - "8"
          - "11"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress -Dstyle.color=never clean test
